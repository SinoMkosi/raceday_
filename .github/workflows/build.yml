name: Build API and MVC

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build API
        run: dotnet build Part2/RaceDay.Api/RaceDay.Api.csproj -c Release

      - name: Build MVC
        run: dotnet build Part2/RaceDay.Web/RaceDay.Web.csproj -c Release
