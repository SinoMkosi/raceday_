name: Validate Repository Structure

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "/docs folder found."

     -name: Check ERD file exists (PNG or PDF)
  run: |
    if ! find docs -maxdepth 1 -iname "erd*.png" -o -iname "erd*.pdf" | grep -q .; then
      echo "ERROR: No ERD file (erd*.png or erd*.pdf) found in /docs."
      exit 1
    fi
    echo "ERD file found."

      -name: Check API endpoint plan exists (PDF or Markdown)
  run: |
    if ! find docs -maxdepth 1 -iname "api.md" -o -iname "endpoint.md" -o -iname "api.pdf" -o -iname "endpoint.pdf" | grep -q .; then
      echo "ERROR: No API endpoint plan (*.md or *.pdf) found in /docs."
      exit 1
    fi
    echo "API endpoint plan found."

      - name: Check SQL script exists
        run: |
          if ! ls docs/*.sql 2>/dev/null | grep -qi ".sql"; then
            echo "ERROR: No .sql script found in /docs."
            exit 1
          fi
          echo "SQL script found."

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing from the repository root."
            exit 1
          fi
          echo "README.md found."

      - name: All checks passed
        run: echo "Repository structure is valid ✅"
